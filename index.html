<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Life & Health Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="backdrop" aria-hidden="true"></div>
  <main class="wrap">
    <header class="hero">
      <div>
        <p class="eyebrow">Personal Health Log</p>
        <h1>Life & Health Dashboard</h1>
        <p class="lead">Google スプレッドシートの記録を、日次で可視化します。</p>
      </div>
      <div class="meta">
        <div class="pill">
          <span class="pill-label">Records</span>
          <span id="record-count">-</span>
        </div>
        <div class="pill">
          <span class="pill-label">Range</span>
          <span id="date-range">-</span>
        </div>
        <div class="pill">
          <span class="pill-label">Last Entry</span>
          <span id="last-entry">-</span>
        </div>
        <button class="action" id="refresh-button" type="button">更新</button>
      </div>
    </header>

    <section class="card">
      <div class="section-head">
        <div>
          <h2>Daily Ratings</h2>
          <p class="sub">食事・心身・睡眠・筋肉痛などの推移と移動平均</p>
        </div>
        <div class="controls">
          <label>
            Metric
            <select id="metric-select"></select>
          </label>
        </div>
      </div>
      <div class="stats-grid" id="rating-stats"></div>
      <div class="chart-card">
        <canvas id="rating-chart"></canvas>
      </div>
    </section>

    <section class="grid-2">
      <section class="card">
        <div class="section-head">
          <div>
            <h2>Sleep Duration</h2>
            <p class="sub">入眠時間と起床時間から算出した睡眠時間</p>
          </div>
        </div>
        <div class="stats-grid" id="sleep-stats"></div>
        <div class="chart-card">
          <canvas id="sleep-chart"></canvas>
        </div>
      </section>

      <section class="card">
        <div class="section-head">
          <div>
            <h2>Weekly Activity</h2>
            <p class="sub">ジム、外食、人と会う用事などの週次カウント</p>
          </div>
        </div>
        <div class="stats-grid" id="activity-stats"></div>
        <div class="chart-card">
          <canvas id="activity-chart"></canvas>
        </div>
      </section>
    </section>

    <section class="card">
      <div class="section-head">
        <div>
          <h2>Body Symptoms</h2>
          <p class="sub">体の不調で多いワード（トップ10）</p>
        </div>
      </div>
      <div class="stats-grid" id="symptom-stats"></div>
      <div class="chart-card">
        <canvas id="symptom-chart"></canvas>
      </div>
    </section>
  </main>

  <footer class="footer">
    <span id="data-status">Loading data...</span>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
